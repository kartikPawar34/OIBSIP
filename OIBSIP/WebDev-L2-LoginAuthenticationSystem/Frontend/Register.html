<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Auth System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Create Account</h2>
    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="regUsername">Username or Email</label>
        <input type="text" id="regUsername" placeholder="Enter username or email" required>
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Min 8 chars, at least 1 number" required>
      </div>
      <button type="submit">Register</button>
    </form>
    <div id="messageBox" class="message"></div>
    <div class="switch-link">
      Already have an account? <a href="index.html">Login here</a>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
